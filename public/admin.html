<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PGI Admin</title>
<style>

button{font:inherit;cursor:pointer}button.p{background:var(--y);border:0;color:#1b1b1b;font-weight:700;padding:10px 18px;border-radius:8px;width:100%}.err{color:#b3261e;margin-top:8px}

.brand{font-size:20px;font-weight:800;padding:4px 10px 18px;letter-spacing:.5px}.brand small{display:block;font-size:11px;font-weight:600;color:var(--y);letter-spacing:2px;text-transform:uppercase}

.user{font-size:12px;color:#a8d0b5;padding:10px;border-top:1px solid rgba(255,255,255,.15);word-break:break-all}.user button{margin-top:8px;width:100%;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:6px;padding:7px}
.content{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 26px;background:#fff;border-bottom:1px solid var(--line)}.top h1{margin:0;font-size:20px;color:var(--g)}

</style></head><body>
<section id="login"><h2 style="margin-top:0;color:var(--g)">PGI Admin Login</h2><label>Email<input id="em" type="email" autocomplete="username"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><label style="display:flex;gap:6px;align-items:center;margin:-4px 0 10px"><input id="sp" type="checkbox" style="width:auto;margin:0"> Show password</label><button class="p" id="go">Sign in</button><div class="err" id="le"></div></section>

  [['Total registrations', o.students, 'users'], ['Assessment participants', o.participants, 'doc'], ['Assessments completed', o.submitted, 'check'], ['Successful payments', o.paidOrders, 'card'], ['Pending payments', o.pending, 'clock'], ['Failed / cancelled', o.failed, 'alert'], ['Money collected', inr(o.revenuePaise), 'rupee'], ['Coupons generated', o.coupons, 'ticket'], ['Coupons redeemed', o.redeemed, 'ticket'], ['Course enrollments', o.enrollTotal, 'cap']].forEach(([l, n, ic]) => { const d = mk('div', 'kpi'), i = mk('i'), w = mk('div'); i.appendChild(icon(ic)); w.append(mk('b', '', n), mk('span', '', l)); d.append(i, w); g.appendChild(d); });
  const p = mk('div', 'panel'); p.append(mk('h3', '', 'Revenue report'), mk('p', 'count', 'Money collected counts only verified successful payments in this batch. Pending and cancelled orders are not revenue.'), Object.assign(btn('Download Excel report', xlsx), { className: 'bt pri' })); v.append(g, p); }
async function signOut(m) { await sb.auth.signOut(); token = null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('le').textContent = m || ''; }
async function enter(session) { token = session.access_token; $('who').textContent = session.user.email; try { await api('/overview?batch=all'); await loadBatches(true); } catch (e) { return signOut(e.status === 403 ? 'This account is not an admin.' : e.message); } $('login').classList.add('hidden'); $('app').classList.remove('hidden'); tabs(); load(); }
