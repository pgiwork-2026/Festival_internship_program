<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PGI Admin</title>
<style>
:root{--g:#1f4d2e;--g2:#2f7a46;--y:#e6b422;--bg:#f3f6f1;--line:#e3e9de;--mut:#6b7a6f}*{box-sizing:border-box}body{margin:0;font:14px/1.45 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#1b2a1f}.hidden{display:none!important}
#login{max-width:380px;margin:12vh auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(31,77,46,.15);border-top:5px solid var(--y)}#login h2{margin:0 0 14px;color:var(--g)}
input{width:100%;padding:10px 12px;margin:6px 0 12px;border:1px solid #cfd8ca;border-radius:8px;font:inherit;background:#fff}input:focus{outline:2px solid var(--y);border-color:var(--y)}
button{font:inherit;cursor:pointer}button.p{background:var(--y);border:0;color:#1b1b1b;font-weight:700;padding:10px 18px;border-radius:8px;width:100%}.err{color:#b3261e;margin-top:8px}
#app{display:flex;min-height:100vh}aside{width:230px;background:linear-gradient(180deg,#183d24,#1f4d2e);color:#fff;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{font-size:20px;font-weight:800;padding:4px 10px 18px;letter-spacing:.5px}.brand small{display:block;font-size:11px;font-weight:600;color:var(--y);letter-spacing:2px;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:4px;flex:1}nav button{background:none;border:0;color:#d5e5d9;text-align:left;padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:center}nav button:hover{background:rgba(255,255,255,.1)}nav button.on{background:var(--y);color:#1b1b1b;font-weight:700}
.user{font-size:12px;color:#b9d0bf;padding:10px;border-top:1px solid rgba(255,255,255,.15);word-break:break-all}.user button{margin-top:8px;width:100%;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:6px;padding:7px}
.content{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 26px;background:#fff;border-bottom:1px solid var(--line)}.top h1{margin:0;font-size:20px;color:var(--g)}
.tools{display:flex;gap:8px}.tools input{margin:0;width:240px}.tools button{background:#fff;border:1px solid var(--g);color:var(--g);border-radius:8px;padding:8px 14px;font-weight:600}.tools button:hover{background:var(--g);color:#fff}
main{padding:22px 26px}.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:12px;background:#eef5ea;display:grid;place-items:center}.kpi b{display:block;font-size:22px;color:var(--g);line-height:1.1}.kpi span{color:var(--mut);font-size:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}.panel h3{margin:0 0 12px;color:var(--g);font-size:15px}.fr{display:grid;grid-template-columns:140px 1fr 50px;gap:10px;align-items:center;margin:9px 0}.fr div.t{background:#eef2ea;border-radius:8px;height:18px;overflow:hidden}.fr div.t div{height:100%;background:linear-gradient(90deg,var(--g2),var(--y));border-radius:8px}
.count{color:var(--mut);margin-bottom:8px;font-size:13px}.wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 190px)}table{border-collapse:collapse;width:100%}th,td{padding:10px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid #eef1ea}
th{background:#f0f5ec;color:var(--g);font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}tbody tr:hover{background:#fbfcf6}
.b{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:#e8ece4;color:#444}.b.ok{background:#d6efdc;color:#15602d}.b.bad{background:#fadcd9;color:#8c1d18}.b.warn{background:#fff0c2;color:#7a5a00}
td button{background:#fff;border:1px solid var(--g);color:var(--g);border-radius:6px;padding:4px 10px;margin-right:4px;font-size:12px}td button:hover{background:var(--g);color:#fff}
@media(max-width:800px){#app{flex-direction:column}aside{width:100%;height:auto;position:static;padding:10px}nav{flex-direction:row;overflow:auto}.tools input{width:100%}.top,main{padding:14px}}
</style></head><body>
<section id="login"><h2 style="margin-top:0;color:var(--g)">PGI Admin Login</h2><label>Email<input id="em" type="email" autocomplete="username"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><label style="display:flex;gap:6px;align-items:center;margin:-4px 0 10px"><input id="sp" type="checkbox" style="width:auto;margin:0"> Show password</label><button class="p" id="go">Sign in</button><div class="err" id="le"></div></section>
<div id="app" class="hidden"><aside><div class="brand">Plant Green Inertia<small>Admin Console</small></div><nav id="tabs"></nav><div class="user"><div id="who"></div><button id="out">Sign out</button></div></aside>
<div class="content"><div class="top"><h1 id="ttl">Overview</h1><div class="tools hidden" id="tools"><input id="q" placeholder="Search…"><button id="csv">Export CSV</button><button id="ref">Refresh</button></div></div><main id="view"></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $ = i => document.getElementById(i); let sb, token, tab = 'overview', data = [], cols = [];
const inr = p => '\u20B9' + (p / 100).toLocaleString('en-IN'), dt = d => d ? new Date(d).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' }) : '-';
const badge = (t, ok) => { const s = document.createElement('span'); s.className = 'b ' + (ok === true ? 'ok' : ok === false ? 'bad' : ok === 'warn' ? 'warn' : ''); s.textContent = t; return s; };
async function api(p, body) { const r = await fetch('/api/admin' + p, { method: body ? 'POST' : 'GET', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || 'Request failed (HTTP ' + r.status + ')'), { status: r.status }); return j; }
async function evidence(id) { const w = window.open('', '_blank'); if (!w) return alert('Allow pop-ups to view the evidence.'); const d = w.document; d.title = 'Proctoring evidence'; d.body.textContent = 'Loading…';
  try { const r = await fetch(`/api/admin/attempts/${id}/evidence`, { headers: { Authorization: 'Bearer ' + token } }); if (!r.ok) throw new Error('HTTP ' + r.status); const list = await r.json();
    d.body.textContent = ''; d.body.style.cssText = 'font-family:Segoe UI,system-ui,sans-serif;margin:20px;background:#f3f6f1';
    const h = d.createElement('h2'); h.textContent = `Proctoring evidence: ${list.length} flagged event${list.length === 1 ? '' : 's'}`; d.body.appendChild(h);
    list.forEach(v => { const c = d.createElement('div'); c.style.cssText = 'display:inline-block;vertical-align:top;margin:8px;padding:10px;background:#fff;border:1px solid #cfd8ca;border-radius:10px;width:280px';
      const t = d.createElement('b'); t.textContent = v.label; c.appendChild(t); const m = d.createElement('div'); m.style.cssText = 'font-size:12px;color:#51675a;margin:4px 0'; m.textContent = new Date(v.at).toLocaleString() + (v.counted ? '' : ' (logged only, not counted)'); c.appendChild(m);
      if (v.snapshot) { const i = d.createElement('img'); i.src = v.snapshot; i.style.cssText = 'width:100%;border-radius:6px'; c.appendChild(i); } else { const n = d.createElement('div'); n.style.cssText = 'font-size:12px;color:#999'; n.textContent = 'No snapshot saved for this event'; c.appendChild(n); }
      d.body.appendChild(c); });
  } catch (e) { d.body.textContent = 'Could not load evidence: ' + e.message; } }
async function pdf(id) { try { const r = await fetch(`/api/admin/attempts/${id}/report.pdf`, { headers: { Authorization: 'Bearer ' + token } }); if (!r.ok) throw new Error('Report unavailable (HTTP ' + r.status + ')'); window.open(URL.createObjectURL(await r.blob()), '_blank'); } catch (e) { alert(e.message); } }
const btn = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = f; return b; };
const act = (...bs) => { const s = document.createElement('span'); bs.forEach(b => s.appendChild(b)); return s; };
const TABS = {
  students: ['Students & registrations', [['Name', r => r.name], ['Email', r => r.email], ['Phone', r => r.phone], ['Registered', r => dt(r.registered)], ['Test', r => r.status || 'Not attempted'], ['Score %', r => r.score ?? '-'], ['Coupon', r => r.coupon || '-'], ['Enrolled', r => r.enrolled ? badge(r.enrolled, r.enrolled === 'active') : '-']]],
  attempts: ['Test reports', [['Candidate', r => r.name], ['Email', r => r.email], ['Started', r => dt(r.started_at)], ['Status', r => r.status], ['Correct', r => r.status === 'in_progress' ? '-' : `${r.correct_count ?? 0}/${r.total_questions ?? 0}`], ['Score %', r => r.score_percent ?? '-'], ['Violations', r => badge(r.violations, r.violations ? false : true)],
    ['Actions', r => r.status === 'in_progress' ? '' : act(btn('PDF report', () => pdf(r.id)), btn('Evidence', () => evidence(r.id)), ...(r.hasCoupon ? [btn('Extend coupon +24h', async () => { try { const x = await api('/coupons/' + r.id + '/extend', { hours: 24 }); alert('Coupon now valid until ' + dt(x.expiresAt)); } catch (e) { alert(e.message); } })] : []))]]],
  payments: ['Payments', [['Date', r => dt(r.created)], ['Student', r => r.name], ['Email', r => r.email], ['Course', r => r.course], ['Amount', r => inr(r.amountPaise)], ['Status', r => badge(r.status, r.status === 'paid' ? true : r.status === 'created' ? 'warn' : false)], ['Order ID', r => r.orderId], ['Payment ID', r => r.paymentId || '-'], ['Paid at', r => dt(r.paidAt)]]],
  enrollments: ['Enrollments', [['Enrolled', r => dt(r.enrolled)], ['Student', r => r.name], ['Email', r => r.email], ['Phone', r => r.phone], ['Course', r => r.course], ['Type', r => r.kind], ['Amount', r => inr(r.amountPaise)], ['Txn ref', r => r.ref], ['Status', r => badge(r.status, r.status === 'active')],
    ['Actions', r => btn(r.status === 'active' ? 'Cancel' : 'Re-activate', async () => { if (!confirm('Change enrollment status?')) return; try { await api('/enrollments/' + r.id + '/status', { status: r.status === 'active' ? 'cancelled' : 'active' }); load(); } catch (e) { alert(e.message); } })]]] };
const text = (r, f) => { const v = f(r); return v instanceof Node ? v.textContent : String(v ?? ''); };
function draw() { const q = $('q').value.toLowerCase(), [, cs] = TABS[tab], v = $('view'); v.textContent = '';
  const rows = data.filter(r => !q || cs.some(([, f]) => text(r, f).toLowerCase().includes(q))); const t = document.createElement('table'), h = t.createTHead().insertRow(); cs.forEach(([l]) => { const th = document.createElement('th'); th.textContent = l; h.appendChild(th); });
  const tb = t.createTBody(); rows.forEach(r => { const tr = tb.insertRow(); cs.forEach(([, f]) => { const td = tr.insertCell(), x = f(r); x instanceof Node ? td.appendChild(x) : td.textContent = x ?? ''; }); });
  const w = document.createElement('div'); w.className = 'wrap'; w.appendChild(t); const c = document.createElement('div'); c.className = 'count'; c.textContent = rows.length + ' record(s)'; v.append(c, w); }
async function load() { $('view').textContent = 'Loading…'; try {
  if (tab === 'overview') { $('tools').classList.add('hidden'); const o = await api('/overview'), k = [['Registered students', o.students], ['Tests started', o.attempts], ['Tests completed', o.submitted], ['Tests in progress', o.running], ['Coupons issued', o.coupons], ['Active enrollments', o.enrolled], ['Payments received', o.paidOrders], ['Revenue', inr(o.revenuePaise)], ['Pending orders', o.pending], ['Needs refund', o.refund], ['Proctoring violations', o.violations]];
    const ic = ['\u{1F464}', '\u{1F4DD}', '\u2705', '\u23F3', '\u{1F3AB}', '\u{1F393}', '\u{1F4B3}', '\u{1F4B0}', '\u{1F552}', '\u21A9\uFE0F', '\u{1F6A8}'], g = document.createElement('div'); g.className = 'kpis';
    k.forEach(([l, n], x) => { const d = document.createElement('div'); d.className = 'kpi'; const i = document.createElement('i'); i.textContent = ic[x]; const w = document.createElement('div'), b = document.createElement('b'), sp = document.createElement('span'); b.textContent = n; sp.textContent = l; w.append(b, sp); d.append(i, w); g.appendChild(d); });
    const p = document.createElement('div'); p.className = 'panel'; p.innerHTML = '<h3>Conversion funnel</h3>'; const top = Math.max(o.students, 1);
    [['Registered', o.students], ['Test started', o.attempts], ['Test completed', o.submitted], ['Coupons issued', o.coupons], ['Enrolled', o.enrolled]].forEach(([l, n]) => { const r = document.createElement('div'); r.className = 'fr'; const a = document.createElement('span'), t = document.createElement('div'), f = document.createElement('div'), c = document.createElement('b'); a.textContent = l; t.className = 't'; f.style.width = Math.min(100, n / top * 100) + '%'; t.appendChild(f); c.textContent = n; r.append(a, t, c); p.appendChild(r); });
    $('view').textContent = ''; $('view').append(g, p); return; }
  $('tools').classList.remove('hidden'); data = await api('/' + tab); draw(); } catch (e) { if (e.status === 403 || e.status === 401) return signOut(e.message); $('view').textContent = e.message; } }
const ICON = { overview: '\u{1F4CA}', students: '\u{1F465}', attempts: '\u{1F4CB}', payments: '\u{1F4B3}', enrollments: '\u{1F393}' };
function tabs() { const n = $('tabs'); n.textContent = ''; [['overview', 'Overview'], ...Object.entries(TABS).map(([k, v]) => [k, v[0]])].forEach(([k, l]) => { const b = btn(ICON[k] + '  ' + l, () => { tab = k; $('q').value = ''; tabs(); load(); }); if (k === tab) { b.className = 'on'; $('ttl').textContent = l; } n.appendChild(b); }); }
async function signOut(m) { await sb.auth.signOut(); token = null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('le').textContent = m || ''; }
async function enter(session) { token = session.access_token; $('who').textContent = session.user.email; try { await api('/overview'); } catch (e) { return signOut(e.status === 403 ? 'This account is not an admin.' : e.message); } $('login').classList.add('hidden'); $('app').classList.remove('hidden'); tabs(); load(); }
$('go').onclick = async () => { $('le').textContent = ''; const { data: d, error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value }); error ? $('le').textContent = error.message : enter(d.session); };
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); }); $('sp').onchange = e => { $('pw').type = e.target.checked ? 'text' : 'password'; }; $('out').onclick = () => signOut(); $('q').oninput = draw; $('ref').onclick = load;
$('csv').onclick = () => { const cs = TABS[tab][1].filter(([l]) => l !== 'Actions'), q = v => '"' + String(v).replace(/"/g, '""') + '"'; const lines = [cs.map(([l]) => q(l)).join(',')].concat(data.map(r => cs.map(([, f]) => q(text(r, f))).join(','))); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = tab + '.csv'; a.click(); };
(async () => { const c = await (await fetch('/api/config')).json(); sb = supabase.createClient(c.supabaseUrl, c.supabaseAnonKey); const { data: d } = await sb.auth.getSession(); if (d.session) enter(d.session); })();
</script></body></html>
