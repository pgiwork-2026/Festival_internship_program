services:
  - type: web
    name: pgi-winter-portal
    env: node
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Plant Green Inertia <admissions@plantgreeninertia.com>
      - key: PUBLIC_BASE_URL
        sync: false
